<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:       #06080e;
    --card:     #0c1018;
    --border:   #181f2e;
    --gold:     #f5c518;
    --gold-dim: rgba(245,197,24,0.12);
    --red:      #e8394a;
    --blue:     #3b82f6;
    --cyan:     #06b6d4;
    --green:    #22c55e;
    --orange:   #f97316;
    --purple:   #a855f7;
    --steel:    #94a3b8;
    --text:     #e2e8f0;
    --muted:    #94a3b8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Cairo', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 12px;
    font-size: 14px;
    line-height: 1.5;
  }

  /* ── HEADER ── */
  .page-header {
    text-align: center;
    padding: 22px 16px 18px;
    margin-bottom: 16px;
    background: linear-gradient(135deg, #0e1419 0%, #0c1018 100%);
    border: 1px solid var(--gold-dim);
    border-radius: 16px;
    position: relative;
    overflow: hidden;
  }
  .page-header::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at 50% 0%, rgba(245,197,24,0.07) 0%, transparent 68%);
    pointer-events: none;
  }
  .header-tag {
    display: inline-block;
    background: var(--gold-dim);
    color: var(--gold);
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 2px;
    padding: 3px 10px;
    border-radius: 20px;
    border: 1px solid rgba(245,197,24,0.25);
    margin-bottom: 10px;
    text-transform: uppercase;
  }
  .header-title {
    font-size: 2rem;
    font-weight: 900;
    color: var(--gold);
    text-shadow: 0 0 20px rgba(245,197,24,0.45);
    letter-spacing: 3px;
    margin-bottom: 4px;
  }
  .header-sub {
    font-size: 0.82rem;
    color: var(--muted);
    margin-bottom: 10px;
  }
  .header-badge-row {
    display: flex;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
    margin-top: 8px;
  }
  .badge {
    display: flex;
    align-items: center;
    gap: 5px;
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 4px 10px;
    font-size: 0.75rem;
    color: var(--muted);
  }
  .badge span { color: var(--text); font-weight: 700; }

  /* ── PODIUM ── */
  .podium-section {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 10px;
    margin-bottom: 16px;
  }
  .podium-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px 12px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  .podium-card.rank-1 { border-color: #f5c518; box-shadow: 0 0 18px rgba(245,197,24,0.18); }
  .podium-card.rank-2 { border-color: #94a3b8; }
  .podium-card.rank-3 { border-color: #f97316; }
  .podium-medal { font-size: 1.6rem; margin-bottom: 4px; }
  .podium-name {
    font-size: 0.78rem;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 4px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .podium-score {
    font-size: 0.85rem;
    font-weight: 900;
    color: var(--gold);
  }
  .podium-id { font-size: 0.65rem; color: var(--muted); margin-top: 2px; }

  /* ── SEARCH / FILTER BAR ── */
  .search-bar {
    display: flex;
    gap: 8px;
    margin-bottom: 14px;
  }
  .search-bar input {
    flex: 1;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-family: 'Cairo', sans-serif;
    font-size: 0.82rem;
    padding: 8px 14px;
    outline: none;
  }
  .search-bar input:focus { border-color: var(--gold-dim); }
  .search-bar input::placeholder { color: var(--muted); }

  /* ── TABLE ── */
  .table-wrap {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    overflow: hidden;
    margin-bottom: 16px;
  }
  .table-head {
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  .table-head-title {
    font-weight: 700;
    font-size: 0.85rem;
    color: var(--gold);
  }
  .table-count {
    font-size: 0.72rem;
    color: var(--muted);
  }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.78rem;
  }
  thead th {
    background: rgba(0,0,0,0.35);
    color: var(--muted);
    font-weight: 700;
    font-size: 0.68rem;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    padding: 9px 10px;
    text-align: left;
    white-space: nowrap;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    user-select: none;
  }
  thead th:hover { color: var(--gold); }
  thead th.active { color: var(--gold); }
  thead th .sort-icon { opacity: 0.4; margin-left: 3px; }
  thead th.active .sort-icon { opacity: 1; }
  tbody tr {
    border-bottom: 1px solid rgba(24,31,46,0.7);
    transition: background 0.1s;
  }
  tbody tr:last-child { border-bottom: none; }
  tbody tr:hover { background: rgba(255,255,255,0.025); }
  tbody tr.top-3 { background: rgba(245,197,24,0.04); }
  tbody tr.inactive { opacity: 0.45; }
  td { padding: 8px 10px; vertical-align: middle; }
  .td-rank {
    width: 36px;
    text-align: center;
    font-weight: 900;
    font-size: 0.75rem;
  }
  .rank-badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 24px;
    height: 24px;
    border-radius: 6px;
    font-size: 0.72rem;
    font-weight: 900;
  }
  .rank-1 .rank-badge { background: rgba(245,197,24,0.2); color: #f5c518; }
  .rank-2 .rank-badge { background: rgba(148,163,184,0.2); color: #cbd5e1; }
  .rank-3 .rank-badge { background: rgba(249,115,22,0.2); color: #f97316; }
  .rank-badge.normal { background: rgba(255,255,255,0.06); color: var(--muted); }
  .td-id { color: var(--muted); font-size: 0.68rem; white-space: nowrap; }
  .td-pseudo { font-weight: 700; color: var(--text); max-width: 130px; }
  .pseudo-txt { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; max-width: 130px; }
  .td-day { text-align: right; white-space: nowrap; color: var(--steel); font-variant-numeric: tabular-nums; }
  .td-total { text-align: right; font-weight: 900; color: var(--gold); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .td-avg { text-align: right; white-space: nowrap; color: var(--cyan); font-variant-numeric: tabular-nums; }
  .td-bar { width: 80px; padding-right: 14px; }
  .bar-bg {
    width: 100%;
    height: 5px;
    background: rgba(255,255,255,0.07);
    border-radius: 3px;
    overflow: hidden;
  }
  .bar-fill {
    height: 100%;
    border-radius: 3px;
    background: linear-gradient(90deg, var(--gold), #fde68a);
    transition: width 0.3s;
  }
  .zero-row td { color: var(--muted) !important; opacity: 0.35; }
  .zero-row .td-total { color: var(--muted) !important; }

  /* ── SUMMARY CARDS ── */
  .summary-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
    margin-bottom: 16px;
  }
  .sum-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 14px 12px;
  }
  .sum-label {
    font-size: 0.68rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--muted);
    margin-bottom: 6px;
  }
  .sum-value {
    font-size: 1.15rem;
    font-weight: 900;
    color: var(--gold);
    line-height: 1;
  }
  .sum-sub { font-size: 0.7rem; color: var(--muted); margin-top: 4px; }

  /* ── FOOTER ── */
  .nwh-footer {
    text-align: center;
    padding: 18px 12px;
    background: linear-gradient(135deg, #0e1419, #0c1018);
    border: 1px solid var(--border);
    border-radius: 14px;
    margin-top: 12px;
  }
  .footer-shield { font-size: 1.5rem; margin-bottom: 4px; }
  .footer-name { font-weight: 900; font-size: 0.95rem; color: var(--gold); letter-spacing: 1px; margin-bottom: 3px; }
  .footer-credit { color: var(--muted); font-size: 0.75rem; }
  .back-link {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    color: var(--muted);
    font-size: 0.78rem;
    text-decoration: none;
    margin-bottom: 14px;
    transition: color 0.15s;
  }
  .back-link:hover { color: var(--gold); }

  /* responsive */
  @media (max-width: 480px) {
    .td-day { display: none; }
    .td-bar { display: none; }
    .summary-grid { grid-template-columns: 1fr 1fr; }
  }
</style>
</head>

// Sort by total descending initially, assign rank
let sorted = [...RAW].sort((a,b)=>b.total-a.total);
sorted.forEach((p,i)=>p.rank = i+1);

const maxTotal = sorted[0].total;
const allianceTotal = RAW.reduce((s,p)=>s+p.total,0);
const activePlayers = RAW.filter(p=>p.total>0).length;

// Populate badges
document.getElementById('active-count').textContent = activePlayers;
document.getElementById('alliance-total').textContent = fmtM(allianceTotal);

// Podium
const podiumEl = document.getElementById('podium');
const medals = ['🥇','🥈','🥉'];
sorted.slice(0,3).forEach((p,i)=>{
  podiumEl.innerHTML += `
  <div class="podium-card rank-${i+1}">
    <div class="podium-medal">${medals[i]}</div>
    <div class="podium-name">${esc(p.pseudo)}</div>
    <div class="podium-score">${fmtK(p.total)}</div>
    <div class="podium-id">${p.id}</div>
  </div>`;
});

// Table render
let currentSort = 'rank';
let sortAsc = true;
let filterStr = '';

function renderTable() {
  let data = [...sorted];
  if (filterStr) {
    data = data.filter(p=>
      p.pseudo.toLowerCase().includes(filterStr) ||
      p.id.toLowerCase().includes(filterStr)
    );
  }
  const tbody = document.getElementById('table-body');
  tbody.innerHTML = '';
  data.forEach(p=>{
    const pct = maxTotal > 0 ? (p.total/maxTotal*100).toFixed(1) : 0;
    const isZero = p.total === 0;
    const rowClass = isZero ? 'zero-row' : (p.rank<=3 ? 'top-3' : '');
    const badgeClass = p.rank===1?'rank-1':p.rank===2?'rank-2':p.rank===3?'rank-3':'normal';
    tbody.innerHTML += `
    <tr class="${rowClass}">
      <td class="td-rank"><span class="rank-badge ${badgeClass}">${p.rank}</span></td>
      <td class="td-id">${p.id}</td>
      <td class="td-pseudo"><span class="pseudo-txt" title="${esc(p.pseudo)}">${esc(p.pseudo)}</span></td>
      <td class="td-day">${p.d[0]?fmtK(p.d[0]):'—'}</td>
      <td class="td-day">${p.d[1]?fmtK(p.d[1]):'—'}</td>
      <td class="td-day">${p.d[2]?fmtK(p.d[2]):'—'}</td>
      <td class="td-day">${p.d[3]?fmtK(p.d[3]):'—'}</td>
      <td class="td-day">${p.d[4]?fmtK(p.d[4]):'—'}</td>
      <td class="td-day">${p.d[5]?fmtK(p.d[5]):'—'}</td>
      <td class="td-total">${isZero?'—':fmtK(p.total)}</td>
      <td class="td-avg">${isZero?'—':fmtK(p.avg)}</td>
      <td class="td-bar"><div class="bar-bg"><div class="bar-fill" style="width:${pct}%"></div></div></td>
    </tr>`;
  });
  document.getElementById('row-count').textContent = `${data.length} players`;
}

function filterTable() {
  filterStr = document.getElementById('search-input').value.toLowerCase().trim();
  renderTable();
}

function sortTable(col) {
  if (currentSort === col) { sortAsc = !sortAsc; } else { currentSort = col; sortAsc = col==='rank'; }
  sorted.sort((a,b)=>{
    let va, vb;
    if(col==='rank') { va=a.rank; vb=b.rank; }
    else if(col==='id') { va=a.id; vb=b.id; }
    else if(col==='pseudo') { va=a.pseudo.toLowerCase(); vb=b.pseudo.toLowerCase(); }
    else if(col==='d0') { va=a.d[0]; vb=b.d[0]; }
    else if(col==='d1') { va=a.d[1]; vb=b.d[1]; }
    else if(col==='d2') { va=a.d[2]; vb=b.d[2]; }
    else if(col==='d3') { va=a.d[3]; vb=b.d[3]; }
    else if(col==='d4') { va=a.d[4]; vb=b.d[4]; }
    else if(col==='d5') { va=a.d[5]; vb=b.d[5]; }
    else if(col==='total') { va=a.total; vb=b.total; }
    else if(col==='avg') { va=a.avg; vb=b.avg; }
    if(typeof va==='string') return sortAsc ? va.localeCompare(vb) : vb.localeCompare(va);
    return sortAsc ? va-vb : vb-va;
  });
  document.querySelectorAll('thead th').forEach(th=>th.classList.remove('active'));
  renderTable();
}

function fmtK(n) {
  if(n>=1e9) return (n/1e9).toFixed(2)+'B';
  if(n>=1e6) return (n/1e6).toFixed(2)+'M';
  if(n>=1e3) return (n/1e3).toFixed(1)+'K';
  return n.toString();
}
function fmtM(n) {
  if(n>=1e9) return (n/1e9).toFixed(2)+'B';
  if(n>=1e6) return (n/1e6).toFixed(1)+'M';
  return fmtK(n);
}
function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

renderTable();
